name: sedd_vhh

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # Core scientific packages
  - numpy
  - scipy
  - pandas
  - pyyaml
  - tqdm

  # PyTorch
  - pytorch
  - torchvision
  - torchaudio

  # Build/runtime tools
  - pip

  - pip:
      # Hydra configuration
      - hydra-core==1.3.2
      - omegaconf==2.3.0

      # Slurm launcher
      - submitit==1.5.4
      - hydra-submitit-launcher==1.2.0

      # Training utilities
      - wandb==0.29.0
      - accelerate==1.14.0

      # Model utilities
      - einops==0.8.2
      - fancy-einsum==0.0.3

      # Type checking / utilities
      - jaxtyping==0.3.7
      - typeguard==4.6.0
      - rich==15.0.0

      # Optional HF/data utilities
      - transformers==5.16.1
      - tokenizers==0.23.1
      - safetensors==0.8.0
      - datasets==5.0.1
      - pyarrow==25.0.1